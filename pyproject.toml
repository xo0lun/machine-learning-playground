[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "machine-learning-playground"
version = "0.1.0"
description = "A practical collection of Machine Learning algorithms implemented in Python."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

authors = [
    { name = "xo0lun" }
]

dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "matplotlib",
    "plotly"
]
